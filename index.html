<style>

:root[data-theme="dark"]{color-scheme:dark;--bg:#17201a;--card:#202c24;--ink:#eaf2ea;--mut:#a3b5a8;--gl:#27382c;--beige:#2c3328;--line:#33433a;--gd:#7cc48a;--err:#ff7a68}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',Tahoma,Arial,sans-serif;line-height:1.7;font-size:16px}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:8px 14px;gap:8px}
.logo{font-weight:800;font-size:22px;color:var(--gd);cursor:pointer;background:none;border:0;min-height:44px}
nav{display:flex;gap:4px}nav button{background:none;border:0;border-radius:12px;padding:8px 12px;min-height:44px;cursor:pointer;color:var(--mut);font-weight:500}

main{max-width:980px;margin:0 auto;padding:16px 14px 40px}

.feat{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh);text-align:center}.feat b{display:block}
.btn{background:var(--gd);color:#fff;border:0;border-radius:14px;padding:12px 22px;min-height:48px;font-weight:700;cursor:pointer}
:root[data-theme="dark"] .btn:not(.sec):not(.dng),:root[data-theme="dark"] .chip.on,.btn.dk{color:#10200f}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.sec):not(.dng),:root:not([data-theme="light"]) .chip.on{color:#10200f}}
.btn.sec{background:var(--gl);color:var(--gd)}.btn.dng{background:transparent;color:var(--err);border:1px solid var(--err)}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.panel{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--sh);max-width:520px;margin:0 auto}

input[type=text],input[type=number],select{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.err{color:var(--err);font-size:14px;min-height:20px;margin:2px 0 0}
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0;background:var(--gl);padding:12px;border-radius:12px;font-weight:400}
.chk input{width:22px;height:22px;margin-top:3px;flex:none}.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.note{background:var(--beige);border-radius:14px;padding:10px 14px;font-size:14px;color:var(--mut);margin:10px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;min-height:44px;cursor:pointer}
.chip.on{background:var(--gd);border-color:var(--gd);color:#fff;font-weight:700}
h3.sec{margin:22px 0 8px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mc{background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.pic{height:120px;display:flex;align-items:center;justify-content:center;font-size:60px;position:relative}
.pic .fav{position:absolute;top:8px;left:8px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:22px;cursor:pointer}
.mb{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}.mb b{font-size:17px}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}.tag{background:var(--gl);color:var(--gd);border-radius:8px;padding:1px 8px}.tag.n{background:var(--beige);color:var(--mut)}
.mb .btn{margin-top:auto;padding:8px;min-height:44px}
.empty{text-align:center;padding:36px 16px;background:var(--card);border-radius:18px;color:var(--mut)}.empty .big{font-size:48px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet h2{margin:4px 0;color:var(--gd)}.nut{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:10px 0}.nut div{background:var(--gl);border-radius:12px;padding:6px 2px;font-size:13px}.nut b{display:block;font-size:17px}
.sheet li{margin:3px 0}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:30}
.foot{text-align:center;color:var(--mut);font-size:13px;margin-top:26px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
nav{overflow-x:auto}@media(max-width:400px){nav button{padding:8px 8px;font-size:14px}.logo{font-size:19px}}
</style>
</head>

function meals(){return M.map(function(m,i){m.id=i;return m}).filter(function(m){return st.user.diet==='n'||m.v===1})}
function card(m){var c=CATS[m.c],f=st.favs.indexOf(m.id)>-1;return '<article class="mc"><div class="pic" style="background:'+c[2]+'">'+m.e+'<button class="fav" data-a="fav" data-id="'+m.id+'" aria-label="'+(f?'إزالة من المفضلة':'إضافة إلى المفضلة')+'">'+(f?'❤️':'🤍')+'</button></div><div class="mb"><b>'+m.n+'</b><div class="tags"><span class="tag">'+(m.v?'نباتي':'غير نباتي')+'</span><span class="tag n">≈ '+m.k+' سعرة</span></div><button class="btn sec" data-a="open" data-id="'+m.id+'">المكونات والتحضير</button></div></article>'}
function home(){var g=st.user.gender==='f'?'أهلًا بكِ':'أهلًا بك',all=meals(),h='<h2>'+g+' يا '+esc(st.user.name)+' 👋</h2><div class="note">اقتراحات عامة ومتوازنة وليست تشخيصًا أو حمية علاجية. القيم الغذائية تقريبية لحصة واحدة، ولا نعتمد الطول والوزن لتحديد احتياجك الدقيق. "نباتي" هنا يشمل الألبان والعسل دون اللحوم والأسماك والبيض. لاحتياج خاص راجع مختصًا.</div><div class="chips"><button class="chip'+(filter==='all'?' on':'')+'" data-a="flt" data-f="all">الكل</button>';
for(var k in CATS)h+='<button class="chip'+(filter===k?' on':'')+'" data-a="flt" data-f="'+k+'">'+CATS[k][1]+' '+CATS[k][0]+'</button>';h+='</div>';var any=false;
for(var k2 in CATS){if(filter!=='all'&&filter!==k2)continue;var l=all.filter(function(m){return m.c===k2});if(!l.length)continue;any=true;h+='<h3 class="sec">'+CATS[k2][1]+' '+CATS[k2][0]+'</h3><div class="grid">'+l.map(card).join('')+'</div>'}
if(!any)h+='<div class="empty"><div class="big">🔍</div>لا توجد وجبات مناسبة في هذه الفئة حاليًا. جرّب فئة أخرى.</div>';return h}
function favs(){var l=meals().filter(function(m){return st.favs.indexOf(m.id)>-1});if(!l.length)return '<div class="empty"><div class="big">🤍</div>لم تضف أي وجبة للمفضلة بعد.<br><br><button class="btn" data-a="go" data-v="home">تصفّح الوجبات</button></div>';return '<h2>وجباتك المفضلة ❤️</h2><div class="grid">'+l.map(card).join('')+'</div>'}
function modal(id){var el=$('#modal');if(id===null){el.innerHTML='';return}var m=M[id],f=st.favs.indexOf(id)>-1;
el.innerHTML='<div class="modal" data-a="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+m.n+'"><div style="font-size:54px;text-align:center">'+m.e+'</div><h2>'+m.n+'</h2><div class="tags"><span class="tag">'+(m.v?'نباتي':'غير نباتي')+'</span><span class="tag n">'+CATS[m.c][0]+'</span></div><div class="nut"><div><b>'+m.k+'</b>سعرة</div><div><b>'+m.p+' غ</b>بروتين</div><div><b>'+m.cb+' غ</b>كربوهيدرات</div><div><b>'+m.f+' غ</b>دهون</div></div><p class="note">قيم تقريبية لحصة واحدة وقد تختلف حسب الكميات.</p><h3>المكونات</h3><ul>'+m.i.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><h3>طريقة التحضير</h3><ol>'+m.s.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol><div class="acts"><button class="btn" data-a="fav" data-id="'+id+'">'+(f?'💔 إزالة من المفضلة':'❤️ أضف للمفضلة')+'</button><button class="btn sec" data-a="close-btn">إغلاق</button></div></div></div>'}
function render(){nav();var a=$('#app');if(view!=='welcome'&&view!=='form'&&!st.user)view='welcome';
if(view==='welcome')a.innerHTML=welcome();else if(view==='form'||view==='edit'){a.innerHTML=form(view==='edit');$('#f').addEventListener('submit',submit)}else if(view==='home')a.innerHTML=home();else if(view==='favs')a.innerHTML=favs()}
document.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a;
if(a==='close'){if(e.target===t)modal(null);return}
if(a==='close-btn'){modal(null);return}
if(a==='go')go(t.dataset.v);
else if(a==='flt'){filter=t.dataset.f;render()}
else if(a==='open'){modal(+t.dataset.id);var cb=document.querySelector('[data-a="close-btn"]');if(cb)cb.focus()}
else if(a==='fav'){var id=+t.dataset.id,i=st.favs.indexOf(id);if(i>-1){st.favs.splice(i,1);toast('أُزيلت من المفضلة')}else{st.favs.push(id);toast('أُضيفت إلى المفضلة')}save();var open=$('#modal').innerHTML;render();if(open){modal(id);var fb=document.querySelector('#modal [data-a="fav"]');if(fb)fb.focus()}}
else if(a==='del'){if(confirm('سيتم حذف بياناتك ومفضلاتك من هذا الجهاز. هل أنت متأكد؟')){wipe();toast('تم حذف بياناتك');go('welcome')}}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')modal(null)});
load();render();
})();
</script>
</body>
</html>
